<!doctype html><html lang="zh-CN"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#152331;color:white;font:14px system-ui}#scene{position:absolute;inset:0}#panel{position:absolute;top:8px;left:8px;right:8px;padding:10px;background:#152331d9;border-radius:8px;z-index:9}button{padding:9px;border:0;border-radius:5px;background:#386078;color:white}p{margin:6px 0}</style><div id="scene"></div><div id="panel"><button id="reset">恢复原视角</button><p>单指旋转 · 双指缩放／平移</p><p id="status">正在加载本机重建场景…</p></div><script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module">
import {Viewer} from './gaussian-splats-3d.module.js';
try{const config=await(await fetch('./result/viewer_config.json')).json();const viewer=new Viewer({rootElement:document.querySelector('#scene'),cameraUp:[0,-1,0],initialCameraPosition:[0,0,0],initialCameraLookAt:[0,0,config.targetZ],sharedMemoryForWorkers:false,gpuAcceleratedSort:false,enableSIMDInSort:false,integerBasedSort:false,sphericalHarmonicsDegree:0,sceneRevealMode:2});window.splatViewer=viewer;
function reset(){viewer.controls.autoRotate=false;viewer.controls.enableDamping=false;viewer.controls.update();viewer.camera.position.set(0,0,0);viewer.camera.up.set(0,-1,0);viewer.controls.target.set(0,0,config.targetZ);viewer.camera.fov=config.fov;viewer.camera.near=.01;viewer.camera.updateProjectionMatrix();viewer.controls.update();viewer.controls.enableDamping=true;}
document.querySelector('#reset').onclick=reset;await viewer.addSplatScene('./result/scene_browser.ply',{splatAlphaRemovalThreshold:1,showLoadingUI:true,progressiveLoad:false});reset();viewer.start();document.querySelector('#status').textContent='已加载 '+config.count.toLocaleString()+' 个高斯';window.viewerReady=true;console.log('DEMO_VIEWER_READY '+config.count);
}catch(e){document.querySelector('#status').textContent='场景加载失败：'+e.message;console.error('DEMO_VIEWER_ERROR '+e);}
</script></html>
