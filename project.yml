name: GaussianIOS
options:
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'MOBILEGS_COREML=1']
    HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/native/include', '$(PODS_ROOT)/Headers/Public/onnxruntime-c']
targets:
  GaussianIOS:
    type: application
    platform: iOS
    sources:
      - path: app
        excludes: [Resources]
      - path: native/src
        excludes: [photo_session_bench.cpp]
      - path: native/include
      - path: app/Resources/example.png
        buildPhase: resources
      - path: app/Resources/model-manifest.json
        buildPhase: resources
      - path: app/Resources/viewer
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hezic.mobilegs.iosdemo
        SWIFT_OBJC_BRIDGING_HEADER: app/BridgingHeader.h
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: 照片重建
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
      - sdk: WebKit.framework
      - sdk: PhotosUI.framework
schemes:
  GaussianIOS:
    build:
      targets:
        GaussianIOS: all
